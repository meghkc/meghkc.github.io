name: Megh Bahadur KC
short_name: Megh KC
headline: Ph.D. Candidate in Civil Engineering, University at Buffalo (SUNY)
secondary: Transportation Engineer, California Department of Transportation
statement: >-
  I build optimization models and reinforcement-learning agents that help transit agencies
  electrify their bus fleets, and data tools that help cities plan cleaner freight.
bio:
  - >-
    I am a Ph.D. candidate in Civil Engineering at the University at Buffalo, SUNY (expected November 2026),
    advised by Dr. Ziqi Song. My dissertation, <em>Accelerating Bus Transit Electrification through Optimization,
    Metaheuristics and Reinforcement Learning Frameworks</em>, asks how agencies can schedule, charge and size
    electric bus fleets when trips, traffic and electricity prices are uncertain.
  - >-
    I am also a Transportation Engineer at the California Department of Transportation (Caltrans), where I
    develop sub-regional travel demand models and forecasts for traffic operations analysis and environmental
    studies. Before that I modelled national freight flows at the National Laboratory of the Rockies (formerly
    NREL), built a freight VMT and emissions tool for NYC DOT as a subaward PI, and studied travel behavior of
    people with disabilities at Utah State University.
  - >-
    I came to research from practice: six years as a highway engineer and project manager with Nepal's
    Ministry of Physical Infrastructure and Transport, plus university teaching in Nepal and the US.
